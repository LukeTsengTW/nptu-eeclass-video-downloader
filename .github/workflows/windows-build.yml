name: Windows EXE

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.pyw'
      - '**.spec'
      - 'requirements*.txt'
      - '*說明.txt'
      - 'Windows快速開始.txt'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run offline tests on Windows
        run: python -m unittest discover -s tests -p "test_eeclass*.py"
      - name: Build single-file EXE
        run: python scripts/build_windows.py
      - name: Test EXE without Python or yt-dlp on PATH
        run: python scripts/smoke_windows.py dist/eeClass-Windows-x64/eeClass-Downloader.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eeClass-Windows-x64
          path: dist/eeClass-Windows-x64/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
